# Shared overrides for the first multi-map test; does not replace the Abyss configs.
train_tracks: [abyss, volcano_island, sandtrack]
unseen_tracks: [snowtuxpeak, xr591, zengarden]
seed: 1000
online_seed_start: 1000
max_steps: 1000  # Fallback only; calibrated per-map limits take precedence.
step_size: 0.1

# 5k ONLINE steps total across the three training maps; finish the final episode.
N: 2  # DAgger: offline fit/eval, then one online collection/train/eval round.
steps_per_iteration: 5000
total_env_steps: 5000  # RLPD online budget.
eval_every: 5000
normalize_observations: false  # RLPD only. DAgger keeps its fitted normalizer.

offline:
  dataset: datasets/multimap/offline  # Reuse the existing 27 unique episodes.
  agents: [team4]
  epsilons: [0.0, 0.1, 0.3]
  episodes_per_epsilon: 3
  seed_start: 0
initialization:
  mode: load_offline
  episodes_per_epsilon: ${offline.episodes_per_epsilon}
  epsilons: ${offline.epsilons}
  dataset: ${offline.dataset}

# Preserve the five evaluation seeds; only the training seed count is reduced.
evaluation:
  seeds: [10000, 10001, 10002, 10003, 10004]
  min_steps_improvement: 0
expert_benchmark:
  runs: 5
  seed_start: 10000

diagnostics:
  enabled: true
  stuck_seconds: 5
  stuck_radius_m: 1
  save_evaluation_episodes: true

# Calibrate once before new training. Existing offline episodes retain their original limits.
track_timeouts:
  mode: expert
  margin_steps: 400
  benchmark_max_steps: 5000
  directory: datasets/multimap/expert_reference
