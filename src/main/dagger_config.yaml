# Collection iterations and trajectories per iteration.
N: 1
T: 1
max_steps: 1000
beta_decay: 0.5  # beta_i = beta_decay ** (i - 1); first iteration expert-only, divides by 2
seed: 0        # Episode seeds increment across all iterations.

track: abyss
step_size: 0.1
output_dir: datasets/dagger

actor:
  num_paths: 182
  num_items: 10
  hidden_sizes: [256, 256]
  learning_rate: 0.001
  batch_size: 128
  epochs: 10
  continuous_weight: 1.0
  boolean_weight: 1.0
  device: auto # or cpu

# Validation seeds are fixed and separate from collection seeds.
evaluation:
  seeds: [10000, 10001, 10002, 10003, 10004]
  min_steps_improvement: 1.0
  patience: 5
