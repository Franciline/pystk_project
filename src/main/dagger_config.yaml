# Collection iterations and trajectories per iteration.
N: 5
T: 2  # Learner episodes per later iteration.
max_steps: 1000
initial_trajectories: 1  # First iteration expert-only; later iterations learner-only.
seed: 0        # Episode seeds increment across all iterations.

train_tracks: [abyss, minigolf, lighthouse, hacienda, zengarden]
unseen_tracks: [snowtuxpeak]
step_size: 0.1
output_dir: datasets/dagger5seeds

actor:
  num_paths: 20
  num_items: 10
  hidden_sizes: [256, 256]
  learning_rate: 0.001
  batch_size: 128
  epochs: 5
  continuous_weight: 1.0
  boolean_weight: 1.0
  device: auto # or cpu

# Validation seeds are fixed and separate from collection seeds.
evaluation:
  seeds: [10000, 10001, 10002, 10003, 10004]  # Add seeds to measure variation.
  min_relative_improvement: 0.01  # Absolute decrease in mean actor/expert step ratio.

expert_benchmark:
  runs: 5  # Per training and unseen map, before training.
  seed_start: 10000
