# Iteration 1: initialization, then N-1 step-budget collection/training rounds.
N: 11
steps_per_iteration: 5000  # Minimum online steps; finish/time out the final episode.
max_steps: 1000
track: abyss
step_size: 0.1
seed: 1000
online_seed_start: 1000
online_epsilon: 0.1  # Used only when exploration.mode=random.
# Learner collection only; initialization retains its epsilon random-action mixture.
exploration:
  mode: gaussian  # gaussian or random
  probability: 1.0  # Gaussian perturbation probability per step.
  acceleration_std: 0.05
  steer_std: 0.1
output_dir: datasets/protocol/dagger_seed1000

initialization:
  mode: generate_offline  # generate_offline, single_expert, load_offline
  epsilons: [0.0, 0.1, 0.3]
  episodes_per_epsilon: 3  # Nine episodes total; duplicates retained.
  dataset: datasets/d0_abyss_team4  # Only used by load_offline.

actor:
  num_paths: 182
  num_items: 10
  hidden_sizes: [256, 256]
  learning_rate: 0.001
  batch_size: 256
  epochs: 5
  continuous_weight: 1.0
  boolean_weight: 1.0
  device: auto

evaluation:
  seeds: [10000, 10001, 10002, 10003, 10004]
  min_steps_improvement: 0

expert_benchmark:
  runs: 5
  seed_start: 10000
