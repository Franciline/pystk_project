# Collection iterations and trajectories per iteration.
N: 4
T: 2  # Learner episodes per later iteration.
max_steps: 1000
initial_trajectories: 1  # First iteration expert-only; later iterations learner-only.
seed: 0        # Episode seeds increment across all iterations.

track: abyss
step_size: 0.1
output_dir: datasets/dagger

actor:
  num_paths: 100
  num_items: 10
  hidden_sizes: [256, 256]
  learning_rate: 0.001
  batch_size: 128
  epochs: 5
  continuous_weight: 1.0
  boolean_weight: 1.0
  device: auto # or cpu

# Validation seeds are fixed and separate from collection seeds.
evaluation:
  tracks: [abyss, minigolf]  # Only training-track results select best checkpoint.
  seeds: [10000]  # Add seeds to measure variation.
  min_steps_improvement: 1.0
