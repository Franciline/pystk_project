# Full multi-map experiment: shared overrides for both algorithms.
# Training seeds are selected by the command line; evaluation seeds stay fixed.
train_tracks: [abyss, volcano_island, sandtrack]
unseen_tracks: [snowtuxpeak, xr591, zengarden]
seed: 1000
online_seed_start: 1000
max_steps: 1000  # Fallback only; calibrated per-map limits take precedence.
step_size: 0.1

# 50k ONLINE target across the three training maps, not 50k per map.
N: 11  # DAgger: one offline fit/eval + ten online collection/train/eval rounds.
steps_per_iteration: 5000
total_env_steps: 50000  # RLPD online budget.
eval_every: 5000
normalize_observations: true  # RLPD only. DAgger keeps its fitted normalizer.

offline:
  dataset: datasets/multimap/offline  # Reuse the existing 27 unique episodes.
  agents: [team4]
  epsilons: [0.0, 0.1, 0.3]
  episodes_per_epsilon: 3
  seed_start: 0
initialization:
  mode: load_offline
  episodes_per_epsilon: ${offline.episodes_per_epsilon}
  epsilons: ${offline.epsilons}
  dataset: ${offline.dataset}

# Fixed evaluation seeds on all three train and all three unseen maps.
evaluation:
  seeds: [10000, 10001, 10002, 10003, 10004]
  min_steps_improvement: 0
expert_benchmark:
  runs: 5
  seed_start: 10000

diagnostics:
  enabled: true
  stuck_seconds: 5
  stuck_radius_m: 1
  save_evaluation_episodes: true

# Calibrate once before new training. Existing offline episodes retain their original limits.
track_timeouts:
  mode: expert
  margin_steps: 400
  benchmark_max_steps: 5000
  directory: datasets/multimap/expert_reference

# Pin the previous single-map training settings for this full experiment.
exploration:
  mode: gaussian
  probability: 1.0
  acceleration_std: 0.1
  steer_std: 0.05
online_epsilon: 0.1  # Only used if exploration.mode is changed to random.
actor:
  num_paths: 182
  num_items: 10
  hidden_sizes: [256, 256]
  learning_rate: 0.001
  batch_size: 256
  epochs: 5
  continuous_weight: 1.0
  boolean_weight: 1.0
  device: auto
encoder:
  num_paths: 182
  num_items: 10
learned_actions: [acceleration, steer, brake, drift, fire, nitro]
rlpd:
  hidden_sizes: [256, 256]
  batch_size: 256
  utd_ratio: 10
  num_critics: 5
  num_min_critics: 2
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  temperature_lr: 0.0003
  init_temperature: 0.1
  device: auto
